name: System checks
on:
  pull_request:
  push:
    branches: [aethergate]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      JAX_PLATFORM_NAME: cpu
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Build CPU experiment image
        run: docker build --tag aethergate-evolution:ci .
      - name: Test restricted containers and all experiment modes
        env:
          RUN_DOCKER_TESTS: '1'
          EVOLUTION_DOCKER_IMAGE: aethergate-evolution:ci
        run: python -m unittest test_evolution_docker
      - run: make ci PYTHON=python

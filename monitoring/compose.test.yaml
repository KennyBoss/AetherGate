services:
  alert-receiver:
    image: python:3.12-slim
    command: [python, -B, /test_receiver.py]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./test_receiver.py:/test_receiver.py:ro
    ports:
      - 127.0.0.1:19109:8080

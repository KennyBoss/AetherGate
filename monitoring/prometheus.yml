global:
  scrape_interval: 2s
  evaluation_interval: 2s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - api_version: v2
      static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: aethergate
    static_configs:
      - targets: [exporter:9108]

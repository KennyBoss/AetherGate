<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>TextPy Memory Probe Viewer</title>
  <style>
    :root {
      --paper: #f4f1ea;
      --ink: #181512;
      --muted: #69625a;
      --line: #d2c9bd;
      --panel: #fffdf8;
      --panel-strong: #ebe2d5;
      --green: #087f5b;
      --blue: #155eef;
      --red: #b42318;
      --violet: #6d28d9;
      --gold: #b7791f;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(24, 21, 18, 0.045) 1px, transparent 1px),
        linear-gradient(0deg, rgba(24, 21, 18, 0.045) 1px, transparent 1px),
        var(--paper);
      background-size: 24px 24px;
      font-family: "Avenir Next", "Trebuchet MS", Verdana, sans-serif;
      letter-spacing: 0;
    }

    button,
    input,
    textarea {
      font: inherit;
      letter-spacing: 0;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(300px, 390px) minmax(0, 1fr);
      min-height: 100vh;
    }

    .side {
      border-right: 1px solid var(--line);
      background: rgba(255, 253, 248, 0.94);
      padding: 18px;
      overflow: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-family: "DIN Condensed", "Avenir Next Condensed", "Trebuchet MS", sans-serif;
      font-size: 34px;
      line-height: 0.95;
      font-weight: 800;
      text-transform: uppercase;
    }

    .stamp {
      border: 1px solid var(--ink);
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      white-space: nowrap;
      transform: rotate(2deg);
    }

    .section {
      border-top: 1px solid var(--line);
      padding: 16px 0;
    }

    .section:first-of-type {
      border-top: 0;
      padding-top: 0;
    }

    .label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    input[type="file"],
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: white;
      padding: 9px;
    }

    textarea {
      min-height: 126px;
      resize: vertical;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 12px;
    }

    button {
      border: 1px solid var(--ink);
      border-radius: var(--radius);
      background: var(--ink);
      color: var(--paper);
      min-height: 40px;
      padding: 8px 10px;
      font-weight: 800;
      cursor: pointer;
    }

    button.secondary {
      background: transparent;
      color: var(--ink);
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.62);
      padding: 10px;
      min-height: 70px;
    }

    .metric strong {
      display: block;
      font-size: 22px;
      line-height: 1.1;
    }

    .metric span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 800;
    }

    .main {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-width: 0;
      min-height: 100vh;
    }

    .top-strip {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      border-bottom: 1px solid var(--line);
      padding: 14px 18px;
      background: rgba(244, 241, 234, 0.9);
    }

    .title-line {
      min-width: 0;
    }

    .title-line h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .title-line p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .swatch {
      width: 11px;
      height: 11px;
      border-radius: 999px;
      background: var(--ink);
    }

    .canvas-wrap {
      position: relative;
      min-height: 340px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 253, 248, 0.68);
    }

    #memoryCanvas {
      display: block;
      width: 100%;
      height: 360px;
    }

    .content {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(320px, 0.9fr);
      gap: 16px;
      padding: 16px 18px 24px;
    }

    .panel {
      min-width: 0;
    }

    .panel h3 {
      margin: 0 0 10px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .timeline {
      display: grid;
      gap: 8px;
    }

    .step-row {
      display: grid;
      grid-template-columns: 42px 92px minmax(0, 1fr) 86px;
      gap: 10px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.62);
      padding: 9px;
    }

    .step-index {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .token {
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 13px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .bar {
      height: 9px;
      border-radius: 999px;
      background: var(--panel-strong);
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--blue);
    }

    .prediction {
      text-align: right;
      font-size: 12px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .prediction small {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
    }

    .top-list {
      display: grid;
      gap: 8px;
    }

    .top-item {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.62);
      padding: 10px;
    }

    .top-item strong {
      display: block;
      margin-bottom: 7px;
      font-family: "SFMono-Regular", Consolas, monospace;
      overflow-wrap: anywhere;
    }

    .mini-pred {
      display: grid;
      grid-template-columns: 80px minmax(0, 1fr) 52px;
      gap: 8px;
      align-items: center;
      margin-top: 5px;
      font-size: 12px;
    }

    .empty {
      display: grid;
      place-items: center;
      height: 100%;
      min-height: 420px;
      color: var(--muted);
      text-align: center;
      padding: 24px;
      font-weight: 700;
    }

    .error {
      color: var(--red);
      font-size: 13px;
      font-weight: 800;
      min-height: 18px;
    }

    @media (max-width: 900px) {
      .app {
        grid-template-columns: 1fr;
      }

      .side {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .top-strip,
      .content {
        grid-template-columns: 1fr;
      }

      .legend {
        justify-content: flex-start;
      }
    }

    @media (max-width: 560px) {
      h1 {
        font-size: 29px;
      }

      .step-row {
        grid-template-columns: 34px minmax(0, 1fr);
      }

      .bar,
      .prediction {
        grid-column: 2;
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <h1>Memory<br>Probe</h1>
        <div class="stamp">TextPy</div>
      </div>

      <section class="section">
        <label class="label" for="probeFile">Probe JSON</label>
        <input id="probeFile" type="file" accept="application/json,.json">
        <div class="button-row">
          <button id="loadExample" type="button">Example</button>
          <button id="clearProbe" class="secondary" type="button">Clear</button>
        </div>
      </section>

      <section class="section">
        <label class="label" for="jsonPaste">Paste JSON</label>
        <textarea id="jsonPaste" spellcheck="false" placeholder='{"steps":[...],"summary":{...}}'></textarea>
        <div class="button-row">
          <button id="parsePaste" type="button">Parse</button>
          <button id="fitChart" class="secondary" type="button">Fit</button>
        </div>
        <div id="errorBox" class="error"></div>
      </section>

      <section class="section">
        <div class="metric-grid">
          <div class="metric">
            <strong id="metricSteps">0</strong>
            <span>Steps</span>
          </div>
          <div class="metric">
            <strong id="metricState">0</strong>
            <span>State dim</span>
          </div>
          <div class="metric">
            <strong id="metricNorm">0.000</strong>
            <span>Final norm</span>
          </div>
          <div class="metric">
            <strong id="metricTop">-</strong>
            <span>Final top</span>
          </div>
        </div>
      </section>
    </aside>

    <main class="main">
      <div class="top-strip">
        <div class="title-line">
          <h2 id="titleText">No probe loaded</h2>
          <p id="subtitleText">Load `text_memory_probe.json` to inspect hidden-state dynamics.</p>
        </div>
        <div class="legend">
          <span><i class="swatch" style="background: var(--blue)"></i>Norm</span>
          <span><i class="swatch" style="background: var(--gold)"></i>Delta</span>
          <span><i class="swatch" style="background: var(--green)"></i>Top p</span>
        </div>
      </div>

      <div id="emptyState" class="empty">
        <div>Waiting for a TextPy memory probe JSON.</div>
      </div>

      <section id="viewerContent" hidden>
        <div class="canvas-wrap">
          <canvas id="memoryCanvas" width="1200" height="360"></canvas>
        </div>
        <div class="content">
          <section class="panel">
            <h3>State Timeline</h3>
            <div id="timeline" class="timeline"></div>
          </section>
          <section class="panel">
            <h3>Top Predictions</h3>
            <div id="topPredictions" class="top-list"></div>
          </section>
        </div>
      </section>
    </main>
  </div>

  <script>
    const exampleProbe = {
      prompt: "memory is a river",
      release: "artifacts/releases/current_text_release.json",
      state_dim: 32,
      top_k: 3,
      tokens: ["memory", "is", "a", "river"],
      summary: {
        step_count: 4,
        final_state_norm: 1.2051,
        mean_state_norm: 1.0788,
        max_state_delta_norm: 0.6322,
        final_top_prediction: "river",
        final_top_probability: 0.0259
      },
      steps: [
        {step: 0, token: "memory", token_id: 11, state_norm: 0.7847, state_delta_norm: 0, state_mean: -0.017, state_std: 0.1377, top_prediction: ".", top_probability: 0.0210, top_predictions: [{token: ".", probability: 0.0210}, {token: "is", probability: 0.0209}, {token: "a", probability: 0.0197}]},
        {step: 1, token: "is", token_id: 2, state_norm: 1.1546, state_delta_norm: 0.6267, state_mean: -0.038, state_std: 0.2004, top_prediction: "a", top_probability: 0.0278, top_predictions: [{token: "a", probability: 0.0278}, {token: ".", probability: 0.0242}, {token: "the", probability: 0.0233}]},
        {step: 2, token: "a", token_id: 3, state_norm: 1.1709, state_delta_norm: 0.6322, state_mean: -0.028, state_std: 0.2049, top_prediction: "river", top_probability: 0.0273, top_predictions: [{token: "river", probability: 0.0273}, {token: ".", probability: 0.0250}, {token: "state", probability: 0.0230}]},
        {step: 3, token: "river", token_id: 13, state_norm: 1.2051, state_delta_norm: 0.4444, state_mean: -0.035, state_std: 0.2102, top_prediction: "river", top_probability: 0.0259, top_predictions: [{token: "river", probability: 0.0259}, {token: "of", probability: 0.0251}, {token: ".", probability: 0.0246}]}
      ]
    };

    const state = {
      probe: null
    };

    const els = {
      probeFile: document.getElementById("probeFile"),
      loadExample: document.getElementById("loadExample"),
      clearProbe: document.getElementById("clearProbe"),
      jsonPaste: document.getElementById("jsonPaste"),
      parsePaste: document.getElementById("parsePaste"),
      fitChart: document.getElementById("fitChart"),
      errorBox: document.getElementById("errorBox"),
      metricSteps: document.getElementById("metricSteps"),
      metricState: document.getElementById("metricState"),
      metricNorm: document.getElementById("metricNorm"),
      metricTop: document.getElementById("metricTop"),
      titleText: document.getElementById("titleText"),
      subtitleText: document.getElementById("subtitleText"),
      emptyState: document.getElementById("emptyState"),
      viewerContent: document.getElementById("viewerContent"),
      memoryCanvas: document.getElementById("memoryCanvas"),
      timeline: document.getElementById("timeline"),
      topPredictions: document.getElementById("topPredictions")
    };

    function clamp01(value) {
      return Math.max(0, Math.min(1, value));
    }

    function fmt(value, digits = 3) {
      if (!Number.isFinite(Number(value))) return "-";
      return Number(value).toFixed(digits);
    }

    function validateProbe(payload) {
      if (!payload || !Array.isArray(payload.steps) || !payload.summary) {
        throw new Error("Probe JSON must contain steps[] and summary.");
      }
      if (payload.steps.length === 0) {
        throw new Error("Probe JSON has no steps.");
      }
      for (const row of payload.steps) {
        if (typeof row.token !== "string" || typeof row.state_norm !== "number") {
          throw new Error("Each step needs token and numeric state_norm.");
        }
        if (!Array.isArray(row.top_predictions)) {
          throw new Error("Each step needs top_predictions[].");
        }
      }
      return payload;
    }

    function setError(message) {
      els.errorBox.textContent = message || "";
    }

    function loadProbe(payload) {
      state.probe = validateProbe(payload);
      setError("");
      renderProbe();
    }

    function clearProbe() {
      state.probe = null;
      els.probeFile.value = "";
      els.jsonPaste.value = "";
      setError("");
      renderProbe();
    }

    function renderProbe() {
      const probe = state.probe;
      if (!probe) {
        els.emptyState.hidden = false;
        els.viewerContent.hidden = true;
        els.metricSteps.textContent = "0";
        els.metricState.textContent = "0";
        els.metricNorm.textContent = "0.000";
        els.metricTop.textContent = "-";
        els.titleText.textContent = "No probe loaded";
        els.subtitleText.textContent = "Load `text_memory_probe.json` to inspect hidden-state dynamics.";
        drawChart();
        return;
      }

      const summary = probe.summary;
      els.emptyState.hidden = true;
      els.viewerContent.hidden = false;
      els.metricSteps.textContent = String(summary.step_count ?? probe.steps.length);
      els.metricState.textContent = String(probe.state_dim ?? "-");
      els.metricNorm.textContent = fmt(summary.final_state_norm);
      els.metricTop.textContent = String(summary.final_top_prediction ?? "-");
      els.titleText.textContent = probe.prompt || "Text memory probe";
      els.subtitleText.textContent = probe.release || probe.manifest || probe.checkpoint || "Loaded probe JSON";
      renderTimeline(probe);
      renderTopPredictions(probe);
      drawChart();
    }

    function renderTimeline(probe) {
      const maxNorm = Math.max(...probe.steps.map((row) => row.state_norm), 1e-6);
      els.timeline.innerHTML = "";
      for (const row of probe.steps) {
        const item = document.createElement("div");
        item.className = "step-row";
        const pct = clamp01(row.state_norm / maxNorm) * 100;
        item.innerHTML = `
          <div class="step-index">${String(row.step).padStart(2, "0")}</div>
          <div class="token">${escapeHtml(row.token)}</div>
          <div class="bar" title="state norm ${fmt(row.state_norm, 4)}">
            <div class="bar-fill" style="width: ${pct}%"></div>
          </div>
          <div class="prediction">${escapeHtml(String(row.top_prediction ?? "-"))}<small>p=${fmt(row.top_probability, 4)}</small></div>
        `;
        els.timeline.appendChild(item);
      }
    }

    function renderTopPredictions(probe) {
      els.topPredictions.innerHTML = "";
      for (const row of probe.steps) {
        const item = document.createElement("div");
        item.className = "top-item";
        const preds = row.top_predictions || [];
        const maxProb = Math.max(...preds.map((pred) => pred.probability || 0), 1e-9);
        item.innerHTML = `<strong>${String(row.step).padStart(2, "0")} · ${escapeHtml(row.token)}</strong>`;
        for (const pred of preds) {
          const line = document.createElement("div");
          line.className = "mini-pred";
          const pct = clamp01((pred.probability || 0) / maxProb) * 100;
          line.innerHTML = `
            <span>${escapeHtml(String(pred.token))}</span>
            <div class="bar"><div class="bar-fill" style="width: ${pct}%; background: var(--green)"></div></div>
            <span>${fmt(pred.probability, 4)}</span>
          `;
          item.appendChild(line);
        }
        els.topPredictions.appendChild(item);
      }
    }

    function drawChart() {
      const canvas = els.memoryCanvas;
      const ctx = canvas.getContext("2d");
      const cssWidth = canvas.clientWidth || 1200;
      const cssHeight = canvas.clientHeight || 360;
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.floor(cssWidth * ratio);
      canvas.height = Math.floor(cssHeight * ratio);
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      ctx.clearRect(0, 0, cssWidth, cssHeight);

      const probe = state.probe;
      ctx.fillStyle = "#fffdf8";
      ctx.fillRect(0, 0, cssWidth, cssHeight);
      drawGrid(ctx, cssWidth, cssHeight);
      if (!probe) return;

      const rows = probe.steps;
      const pad = {left: 52, right: 22, top: 26, bottom: 46};
      const chartW = cssWidth - pad.left - pad.right;
      const chartH = cssHeight - pad.top - pad.bottom;
      const maxNorm = Math.max(...rows.map((row) => row.state_norm), 1e-6);
      const maxDelta = Math.max(...rows.map((row) => row.state_delta_norm), 1e-6);
      const maxProb = Math.max(...rows.map((row) => row.top_probability || 0), 1e-6);
      const xAt = (index) => pad.left + (rows.length === 1 ? chartW / 2 : (index / (rows.length - 1)) * chartW);
      const yAt = (value, max) => pad.top + chartH - clamp01(value / max) * chartH;

      drawSeries(ctx, rows.map((row, i) => [xAt(i), yAt(row.state_norm, maxNorm)]), "#155eef", 3);
      drawSeries(ctx, rows.map((row, i) => [xAt(i), yAt(row.state_delta_norm, maxDelta)]), "#b7791f", 2);
      drawSeries(ctx, rows.map((row, i) => [xAt(i), yAt(row.top_probability || 0, maxProb)]), "#087f5b", 2);

      ctx.fillStyle = "#181512";
      ctx.font = "800 11px Avenir Next, sans-serif";
      ctx.textAlign = "center";
      rows.forEach((row, i) => {
        const x = xAt(i);
        ctx.fillText(truncate(row.token, 12), x, cssHeight - 18);
      });
      ctx.textAlign = "left";
      ctx.fillText(`norm max ${fmt(maxNorm)}`, 12, 18);
      ctx.fillText(`delta max ${fmt(maxDelta)}`, 12, 34);
    }

    function drawGrid(ctx, width, height) {
      ctx.strokeStyle = "#d2c9bd";
      ctx.lineWidth = 1;
      for (let x = 52; x < width; x += 72) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }
      for (let y = 26; y < height - 40; y += 48) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }
    }

    function drawSeries(ctx, points, color, width) {
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = width;
      ctx.beginPath();
      points.forEach(([x, y], index) => {
        if (index === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
      for (const [x, y] of points) {
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function truncate(value, max) {
      const text = String(value);
      return text.length > max ? text.slice(0, max - 1) + "…" : text;
    }

    els.probeFile.addEventListener("change", async (event) => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      try {
        loadProbe(JSON.parse(await file.text()));
      } catch (error) {
        setError(error.message);
      }
    });

    els.loadExample.addEventListener("click", () => {
      loadProbe(exampleProbe);
      els.jsonPaste.value = JSON.stringify(exampleProbe, null, 2);
    });

    els.clearProbe.addEventListener("click", clearProbe);

    els.parsePaste.addEventListener("click", () => {
      try {
        loadProbe(JSON.parse(els.jsonPaste.value));
      } catch (error) {
        setError(error.message);
      }
    });

    els.fitChart.addEventListener("click", drawChart);
    window.addEventListener("resize", drawChart);
    renderProbe();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>TextPy Evidence Ledger</title>
  <style>
    :root {
      --paper: #eef0e8;
      --ink: #171915;
      --muted: #62675d;
      --line: #c9cec0;
      --panel: #fbfcf5;
      --panel-strong: #dde4d2;
      --green: #087f5b;
      --blue: #155eef;
      --red: #b42318;
      --gold: #b7791f;
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(23, 25, 21, 0.045) 1px, transparent 1px),
        linear-gradient(0deg, rgba(23, 25, 21, 0.045) 1px, transparent 1px),
        var(--paper);
      background-size: 24px 24px;
      font-family: "Avenir Next", "Trebuchet MS", Verdana, sans-serif;
      letter-spacing: 0;
    }

    button, input, textarea, select {
      font: inherit;
      letter-spacing: 0;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(320px, 420px) minmax(0, 1fr);
      min-height: 100vh;
    }

    .side {
      border-right: 1px solid var(--line);
      background: rgba(251, 252, 245, 0.94);
      padding: 18px;
      overflow: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-family: "DIN Condensed", "Avenir Next Condensed", "Trebuchet MS", sans-serif;
      font-size: 34px;
      line-height: 0.95;
      font-weight: 800;
      text-transform: uppercase;
    }

    .stamp {
      border: 1px solid var(--ink);
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      white-space: nowrap;
      transform: rotate(-2deg);
    }

    .section {
      border-top: 1px solid var(--line);
      padding: 16px 0;
    }

    .section:first-of-type {
      border-top: 0;
      padding-top: 0;
    }

    .label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    input[type="file"], textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: white;
      padding: 9px;
    }

    textarea {
      min-height: 132px;
      resize: vertical;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 12px;
    }

    button {
      border: 1px solid var(--ink);
      border-radius: var(--radius);
      background: var(--ink);
      color: var(--paper);
      min-height: 40px;
      padding: 8px 10px;
      font-weight: 800;
      cursor: pointer;
    }

    button.secondary {
      background: transparent;
      color: var(--ink);
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .file-stack {
      display: grid;
      gap: 11px;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.68);
      padding: 10px;
      min-height: 74px;
    }

    .metric strong {
      display: block;
      font-size: 22px;
      line-height: 1.08;
      overflow-wrap: anywhere;
    }

    .metric span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 800;
    }

    .error {
      min-height: 18px;
      color: var(--red);
      font-size: 13px;
      font-weight: 800;
    }

    .main {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-width: 0;
      min-height: 100vh;
    }

    .top-strip {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      border-bottom: 1px solid var(--line);
      padding: 14px 18px;
      background: rgba(238, 240, 232, 0.92);
    }

    .title-line { min-width: 0; }

    .title-line h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .title-line p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .swatch {
      width: 11px;
      height: 11px;
      border-radius: 999px;
      background: var(--ink);
    }

    .content {
      min-width: 0;
      overflow: auto;
      padding: 18px;
    }

    .empty {
      display: grid;
      min-height: 48vh;
      place-items: center;
      color: var(--muted);
      font-weight: 800;
      text-transform: uppercase;
      text-align: center;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(251, 252, 245, 0.88);
      padding: 14px;
      margin-top: 14px;
    }

    .panel h3 {
      margin: 0 0 10px;
      font-size: 15px;
      text-transform: uppercase;
    }

    .chain-list {
      display: grid;
      gap: 10px;
    }

    .entry-card {
      border: 1px solid var(--line);
      border-left: 6px solid var(--green);
      border-radius: var(--radius);
      background: white;
      padding: 12px;
    }

    .entry-card.warn { border-left-color: var(--gold); }
    .entry-card.fail { border-left-color: var(--red); }

    .entry-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: start;
    }

    .entry-title {
      font-size: 16px;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 8px;
      background: var(--panel-strong);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .pill.ok { background: rgba(8, 127, 91, 0.14); color: var(--green); }
    .pill.fail { background: rgba(180, 35, 24, 0.12); color: var(--red); }
    .pill.warn { background: rgba(183, 121, 31, 0.15); color: var(--gold); }

    .kv-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .kv {
      border-top: 1px solid var(--line);
      padding-top: 8px;
      min-width: 0;
    }

    .kv span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .kv code {
      display: block;
      margin-top: 4px;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      padding: 8px 7px;
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      background: rgba(221, 228, 210, 0.55);
      position: sticky;
      top: 0;
    }

    td code {
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .small {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .mono {
      font-family: "SFMono-Regular", Consolas, monospace;
    }

    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .side { border-right: 0; border-bottom: 1px solid var(--line); }
      .top-strip { grid-template-columns: 1fr; }
      .legend { justify-content: flex-start; }
      .metric-grid, .kv-grid { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 560px) {
      .metric-grid, .kv-grid { grid-template-columns: 1fr; }
      .entry-head { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <h1>Evidence<br>Ledger</h1>
        <span class="stamp">Chain</span>
      </div>

      <div class="section file-stack">
        <label>
          <span class="label">Ledger JSON</span>
          <input id="ledgerFile" type="file" accept="application/json,.json">
        </label>
        <label>
          <span class="label">Validation or Replay Report</span>
          <input id="reportFile" type="file" accept="application/json,.json">
        </label>
      </div>

      <div class="section">
        <label>
          <span class="label">Paste Ledger JSON</span>
          <textarea id="jsonPaste" spellcheck="false" placeholder="{ &quot;kind&quot;: &quot;text_release_evidence_ledger&quot;, ... }"></textarea>
        </label>
        <div class="button-row">
          <button id="renderPaste">Render Paste</button>
          <button id="clearAll" class="secondary">Clear</button>
        </div>
      </div>

      <div class="section">
        <div class="metric-grid" style="grid-template-columns: 1fr 1fr;">
          <div class="metric"><strong id="sideEntries">0</strong><span>Entries</span></div>
          <div class="metric"><strong id="sideChecks">0</strong><span>Checks</span></div>
        </div>
      </div>

      <div id="errorBox" class="error"></div>
    </aside>

    <main class="main">
      <div class="top-strip">
        <div class="title-line">
          <h2 id="headline">Load a release evidence ledger</h2>
          <p id="subhead">Use artifacts/releases/text_release_evidence_ledger.json or a replay ledger.</p>
        </div>
        <div class="legend">
          <span><i class="swatch" style="background: var(--green);"></i> Linked</span>
          <span><i class="swatch" style="background: var(--gold);"></i> Warning</span>
          <span><i class="swatch" style="background: var(--red);"></i> Broken</span>
        </div>
      </div>

      <section class="content">
        <div id="emptyState" class="empty">Load ledger JSON to inspect the chain.</div>
        <div id="viewerContent" hidden>
          <div class="metric-grid" id="summaryMetrics"></div>
          <div class="panel">
            <h3>Ledger Chain</h3>
            <div id="chainList" class="chain-list"></div>
          </div>
          <div class="panel">
            <h3>Artifact Snapshots</h3>
            <div style="overflow:auto;">
              <table>
                <thead>
                  <tr>
                    <th>Entry</th>
                    <th>Artifact</th>
                    <th>Path</th>
                    <th>SHA256</th>
                  </tr>
                </thead>
                <tbody id="artifactRows"></tbody>
              </table>
            </div>
          </div>
          <div class="panel" id="reportPanel" hidden>
            <h3>Loaded Report</h3>
            <div id="reportSummary" class="small"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const els = {
      ledgerFile: document.getElementById("ledgerFile"),
      reportFile: document.getElementById("reportFile"),
      jsonPaste: document.getElementById("jsonPaste"),
      renderPaste: document.getElementById("renderPaste"),
      clearAll: document.getElementById("clearAll"),
      errorBox: document.getElementById("errorBox"),
      emptyState: document.getElementById("emptyState"),
      viewerContent: document.getElementById("viewerContent"),
      headline: document.getElementById("headline"),
      subhead: document.getElementById("subhead"),
      sideEntries: document.getElementById("sideEntries"),
      sideChecks: document.getElementById("sideChecks"),
      summaryMetrics: document.getElementById("summaryMetrics"),
      chainList: document.getElementById("chainList"),
      artifactRows: document.getElementById("artifactRows"),
      reportPanel: document.getElementById("reportPanel"),
      reportSummary: document.getElementById("reportSummary")
    };

    let currentLedger = null;
    let currentReport = null;

    function shortHash(value) {
      return typeof value === "string" && value ? value.slice(0, 12) : "none";
    }

    function fmt(value, digits = 4) {
      if (value === null || value === undefined || value === "") return "n/a";
      const num = Number(value);
      if (!Number.isFinite(num)) return String(value);
      if (Math.abs(num) >= 1000) return Math.round(num).toLocaleString();
      return num.toFixed(digits);
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function validateLedger(ledger) {
      const errors = [];
      const entries = Array.isArray(ledger.entries) ? ledger.entries : [];
      if (ledger.kind !== "text_release_evidence_ledger") errors.push("kind is not text_release_evidence_ledger");
      if (!Array.isArray(ledger.entries)) errors.push("entries is not a list");
      if (Number(ledger.entry_count) !== entries.length) errors.push("entry_count does not match entries length");
      entries.forEach((entry, index) => {
        if (!entry || typeof entry !== "object") {
          errors.push(`entry ${index + 1} is not an object`);
          return;
        }
        if (entry.index !== index + 1) errors.push(`entry ${index + 1} index mismatch`);
        if (index === 0 && entry.previous_hash !== null) errors.push("first entry previous_hash should be null");
        if (index > 0 && entry.previous_hash !== entries[index - 1].entry_hash) {
          errors.push(`entry ${index + 1} previous_hash mismatch`);
        }
      });
      if (entries.length && ledger.chain_head !== entries[entries.length - 1].entry_hash) {
        errors.push("chain_head does not match last entry hash");
      }
      if (!entries.length && ledger.chain_head !== null) errors.push("empty ledger chain_head should be null");
      return { valid: errors.length === 0, errors, entries };
    }

    function artifactRecords(entry) {
      return [
        ["manifest", entry.manifest, entry.manifest_sha256],
        ["archive", entry.archive, entry.archive_sha256],
        ["validation", entry.validation_json, entry.validation_sha256],
        ["restore", entry.restore_json, entry.restore_sha256],
        ["comparison", entry.comparison_json, entry.comparison_sha256]
      ].filter(([, path]) => path);
    }

    function metric(label, value) {
      return `<div class="metric"><strong>${escapeHtml(value)}</strong><span>${escapeHtml(label)}</span></div>`;
    }

    function renderLedger(ledger, sourceLabel = "ledger json") {
      const validation = validateLedger(ledger);
      currentLedger = ledger;
      els.errorBox.textContent = validation.valid ? "" : validation.errors.join("; ");
      els.emptyState.hidden = true;
      els.viewerContent.hidden = false;
      els.headline.textContent = validation.valid ? "Ledger chain linked" : "Ledger chain has warnings";
      els.subhead.textContent = `${sourceLabel} | head ${shortHash(ledger.chain_head)} | kind ${ledger.kind || "unknown"}`;
      els.sideEntries.textContent = validation.entries.length;
      els.sideChecks.textContent = validation.errors.length;

      const artifactCount = validation.entries.reduce((sum, entry) => sum + artifactRecords(entry).length, 0);
      const failedGates = validation.entries.reduce((sum, entry) => sum + Number(entry.failed_gate_count || 0), 0);
      els.summaryMetrics.innerHTML = [
        metric("Entry Count", validation.entries.length),
        metric("Chain Head", shortHash(ledger.chain_head)),
        metric("Artifact Links", artifactCount),
        metric("Failed Gates", failedGates)
      ].join("");

      els.chainList.innerHTML = validation.entries.map((entry, index) => {
        const previousOk = index === 0 ? entry.previous_hash === null : entry.previous_hash === validation.entries[index - 1].entry_hash;
        const headOk = index < validation.entries.length - 1 || ledger.chain_head === entry.entry_hash;
        const stateClass = previousOk && headOk ? "ok" : "fail";
        const cardClass = previousOk && headOk ? "" : " fail";
        return `
          <article class="entry-card${cardClass}">
            <div class="entry-head">
              <div>
                <div class="entry-title">#${entry.index || index + 1} ${escapeHtml(entry.name || entry.release_name || "unnamed")}</div>
                <div class="small">${escapeHtml(entry.registered_at || "")}</div>
              </div>
              <span class="pill ${stateClass}">${stateClass === "ok" ? "linked" : "broken"}</span>
            </div>
            <div class="kv-grid">
              <div class="kv"><span>Entry Hash</span><code title="${escapeHtml(entry.entry_hash)}">${shortHash(entry.entry_hash)}</code></div>
              <div class="kv"><span>Previous Hash</span><code title="${escapeHtml(entry.previous_hash)}">${shortHash(entry.previous_hash)}</code></div>
              <div class="kv"><span>Archive SHA</span><code title="${escapeHtml(entry.archive_sha256)}">${shortHash(entry.archive_sha256)}</code></div>
              <div class="kv"><span>Manifest SHA</span><code title="${escapeHtml(entry.manifest_sha256)}">${shortHash(entry.manifest_sha256)}</code></div>
              <div class="kv"><span>Files</span><code>${fmt(entry.file_count, 0)}</code></div>
              <div class="kv"><span>Loss / Tokens/s</span><code>${fmt(entry.benchmark_loss)} / ${fmt(entry.best_throughput_tokens_s, 0)}</code></div>
            </div>
          </article>
        `;
      }).join("");

      els.artifactRows.innerHTML = validation.entries.flatMap((entry) => artifactRecords(entry).map(([label, path, sha]) => `
        <tr>
          <td>#${entry.index}</td>
          <td>${escapeHtml(label)}</td>
          <td><code>${escapeHtml(path)}</code></td>
          <td><code title="${escapeHtml(sha)}">${escapeHtml(shortHash(sha))}</code></td>
        </tr>
      `)).join("");
      renderReport();
    }

    function renderReport() {
      if (!currentReport) {
        els.reportPanel.hidden = true;
        return;
      }
      els.reportPanel.hidden = false;
      const validation = currentReport.ledger_validation || currentReport;
      const operations = Array.isArray(currentReport.operations)
        ? currentReport.operations.map((op) => `${op.name || "entry"}:${op.action}`).join(", ")
        : "n/a";
      els.reportSummary.innerHTML = `
        <div><strong>valid:</strong> ${escapeHtml(currentReport.valid ?? validation.valid ?? "n/a")}</div>
        <div><strong>entry_count:</strong> ${escapeHtml(validation.entry_count ?? "n/a")}</div>
        <div><strong>artifact_checks:</strong> ${escapeHtml(validation.artifact_checks ?? "n/a")}</div>
        <div><strong>operations:</strong> <span class="mono">${escapeHtml(operations)}</span></div>
      `;
    }

    function readJsonFile(file, callback) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          callback(JSON.parse(reader.result), file.name);
        } catch (error) {
          els.errorBox.textContent = `Invalid JSON: ${error.message}`;
        }
      };
      reader.readAsText(file);
    }

    els.ledgerFile.addEventListener("change", (event) => {
      readJsonFile(event.target.files[0], renderLedger);
    });

    els.reportFile.addEventListener("change", (event) => {
      readJsonFile(event.target.files[0], (payload) => {
        currentReport = payload;
        renderReport();
      });
    });

    els.renderPaste.addEventListener("click", () => {
      try {
        renderLedger(JSON.parse(els.jsonPaste.value), "pasted json");
      } catch (error) {
        els.errorBox.textContent = `Invalid JSON: ${error.message}`;
      }
    });

    els.clearAll.addEventListener("click", () => {
      currentLedger = null;
      currentReport = null;
      els.ledgerFile.value = "";
      els.reportFile.value = "";
      els.jsonPaste.value = "";
      els.errorBox.textContent = "";
      els.sideEntries.textContent = "0";
      els.sideChecks.textContent = "0";
      els.viewerContent.hidden = true;
      els.emptyState.hidden = false;
      els.headline.textContent = "Load a release evidence ledger";
      els.subhead.textContent = "Use artifacts/releases/text_release_evidence_ledger.json or a replay ledger.";
    });
  </script>
</body>
</html>
